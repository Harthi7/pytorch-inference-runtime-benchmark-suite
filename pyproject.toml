[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-runtime-bench"
version = "0.1.0"
description = "Reproducible PyTorch, TorchDynamo, TorchInductor, ONNX Runtime, and Triton inference benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Abdullah Alharthi"}]
keywords = ["pytorch", "torch-compile", "torchdynamo", "torchinductor", "onnxruntime", "triton", "inference", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
onnx = [
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "onnxscript>=0.2",
]
gpu = [
  "onnx>=1.17",
  "onnxruntime-gpu>=1.20; platform_system == 'Linux'",
  "onnxscript>=0.2",
  "triton>=3.1; platform_system == 'Linux'",
  "matplotlib>=3.9",
]
viz = [
  "matplotlib>=3.9",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
]
all-cpu = [
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "onnxscript>=0.2",
  "matplotlib>=3.9",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
]

[project.scripts]
ml-runtime-bench = "ml_runtime_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".benchmark-cache", ".venv", "results"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "triton", "triton.*"]
ignore_missing_imports = true
