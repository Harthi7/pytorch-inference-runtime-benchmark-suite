name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install project
        run: pip install -e ".[dev,viz]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Format check
        run: python -m ruff format --check src tests
      - name: Type check
        run: python -m mypy src/ml_runtime_bench
      - name: Test
        run: python -m pytest --cov=ml_runtime_bench --cov-report=term-missing
      - name: Smoke benchmark
        run: python -m ml_runtime_bench suite --config configs/smoke.json --output results/ci-smoke --strict
      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.python-version }}
          path: results/ci-smoke
